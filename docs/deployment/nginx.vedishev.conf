server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name vedishev.ru;

    return 301 https://vedishev.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.vedishev.ru;

    return 301 https://vedishev.ru$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name vedishev.ru;

    ssl_certificate /etc/letsencrypt/live/vedishev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vedishev.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location /media/ {
        alias /var/www/vedishev/shared/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vedishev.ru;

    ssl_certificate /etc/letsencrypt/live/vedishev.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vedishev.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://vedishev.ru$request_uri;
}
